<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Designer Bench · Blind Visual Review</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0e12'/%3E%3Crect x='2' y='2' width='28' height='28' rx='5.5' fill='none' stroke='%232e3545' stroke-width='1.5'/%3E%3Crect x='6.5' y='7' width='8' height='18' rx='2' fill='%23f59e0b' opacity='0.9'/%3E%3Crect x='17.5' y='7' width='8' height='18' rx='2' fill='%2338bdf8' opacity='0.9'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-canvas: #0c0e12;
      --bg-surface: #13161c;
      --bg-elevated: #191d26;
      --bg-inset: #080a0d;
      --bg-hover: #1f2530;

      --border-hairline: rgba(255, 255, 255, 0.075);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --border-strong: rgba(255, 255, 255, 0.22);

      --ink-primary: #f1f5f9;
      --ink-secondary: #9aa5b6;
      --ink-muted: #647084;

      --accent-neutral: #e2e8f0;
      --accent-reveal-bg: rgba(255, 255, 255, 0.09);

      /* Dynamic Family Palettes (used ONLY when revealed) */
      /* palette-0: Amber */
      --pal-0-ink: #fbbf24;
      --pal-0-bg: rgba(245, 158, 11, 0.13);
      --pal-0-border: rgba(245, 158, 11, 0.34);
      --pal-0-grad: rgba(245, 158, 11, 0.08);

      /* palette-1: Blue */
      --pal-1-ink: #38bdf8;
      --pal-1-bg: rgba(56, 189, 248, 0.13);
      --pal-1-border: rgba(56, 189, 248, 0.34);
      --pal-1-grad: rgba(56, 189, 248, 0.08);

      /* palette-2: Emerald */
      --pal-2-ink: #34d399;
      --pal-2-bg: rgba(16, 185, 129, 0.13);
      --pal-2-border: rgba(16, 185, 129, 0.34);
      --pal-2-grad: rgba(16, 185, 129, 0.08);

      /* palette-3: Violet */
      --pal-3-ink: #a78bfa;
      --pal-3-bg: rgba(139, 92, 246, 0.13);
      --pal-3-border: rgba(139, 92, 246, 0.34);
      --pal-3-grad: rgba(139, 92, 246, 0.08);

      /* palette-4: Rose */
      --pal-4-ink: #fb7185;
      --pal-4-bg: rgba(244, 63, 94, 0.13);
      --pal-4-border: rgba(244, 63, 94, 0.34);
      --pal-4-grad: rgba(244, 63, 94, 0.08);

      /* palette-5: Cyan */
      --pal-5-ink: #22d3ee;
      --pal-5-bg: rgba(6, 182, 212, 0.13);
      --pal-5-border: rgba(6, 182, 212, 0.34);
      --pal-5-grad: rgba(6, 182, 212, 0.08);

      /* Ranking accents */
      --rank-1-ink: #f3d285;
      --rank-1-bg: rgba(243, 210, 133, 0.14);
      --rank-1-border: rgba(243, 210, 133, 0.42);

      --rank-2-ink: #d5dce6;
      --rank-2-bg: rgba(213, 220, 230, 0.12);
      --rank-2-border: rgba(213, 220, 230, 0.36);

      --rank-3-ink: #d49b72;
      --rank-3-bg: rgba(212, 155, 114, 0.14);
      --rank-3-border: rgba(212, 155, 114, 0.38);

      --defect-ink: #f87171;
      --defect-bg: rgba(248, 113, 113, 0.14);
      --defect-border: rgba(248, 113, 113, 0.38);

      --compare-ink: #c4b5fd;
      --compare-bg: rgba(167, 139, 250, 0.14);
      --compare-border: rgba(167, 139, 250, 0.42);

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-canvas);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    button, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible, select:focus-visible {
      outline: 2px solid var(--ink-primary);
      outline-offset: 2px;
    }

    /* Subtle custom scrollbars for dark studio feel */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 99px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid transparent;
      background-clip: content-box;
    }

    /* Top Studio Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(12, 14, 18, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-hairline);
    }

    .topbar-inner {
      max-width: 1720px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 650;
      letter-spacing: -0.015em;
      color: var(--ink-primary);
    }

    .brand-status {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 99px;
      border: 1px solid var(--border-subtle);
      color: var(--ink-secondary);
      background: rgba(255, 255, 255, 0.03);
      transition: all 180ms var(--ease);
    }

    .brand-status.is-revealed {
      color: var(--ink-primary);
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--ink-secondary);
      font-size: 12.5px;
      font-weight: 500;
      transition: background 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease);
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: var(--border-strong);
      color: var(--ink-primary);
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--ink-muted);
    }

    .btn-ghost:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-hairline);
      color: var(--ink-primary);
    }

    .btn-reveal {
      background: var(--ink-primary);
      color: #0b0d11;
      border-color: var(--ink-primary);
      font-weight: 600;
      padding: 0 14px;
    }

    .btn-reveal:hover:not(:disabled) {
      background: #ffffff;
      border-color: #ffffff;
      color: #050608;
    }

    .btn-reveal.is-revealed {
      background: var(--bg-elevated);
      color: var(--ink-primary);
      border-color: var(--border-strong);
    }

    .btn-reveal.is-revealed:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: var(--border-strong);
      color: var(--ink-primary);
    }

    .btn-compare-launch {
      border-color: var(--compare-border);
      background: var(--compare-bg);
      color: var(--compare-ink);
    }

    .btn-compare-launch:hover:not(:disabled) {
      background: rgba(167, 139, 250, 0.22);
      border-color: rgba(167, 139, 250, 0.65);
      color: #ede9fe;
    }

    /* Main Layout */
    .shell {
      max-width: 1720px;
      margin: 0 auto;
      padding: 18px 20px 56px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Challenge Tabs */
    .challenge-bar {
      display: flex;
      align-items: stretch;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .challenge-bar::-webkit-scrollbar {
      display: none;
    }

    .challenge-tab {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-hairline);
      background: var(--bg-surface);
      color: var(--ink-secondary);
      font-size: 13px;
      font-weight: 550;
      white-space: nowrap;
      transition: all 150ms var(--ease);
    }

    .challenge-tab:hover {
      background: var(--bg-elevated);
      border-color: var(--border-subtle);
      color: var(--ink-primary);
    }

    .challenge-tab.is-active {
      background: var(--bg-elevated);
      border-color: var(--border-strong);
      color: var(--ink-primary);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .tab-vote-dots {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .tab-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
    }

    .tab-dot.r1 { background: var(--rank-1-ink); }
    .tab-dot.r2 { background: var(--rank-2-ink); }
    .tab-dot.r3 { background: var(--rank-3-ink); }

    /* Challenge Context + Synchronized Controls */
    .control-strip {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .challenge-meta {
      min-width: 240px;
      flex: 1;
    }

    .challenge-title {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--ink-primary);
    }

    .challenge-subtitle {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--ink-secondary);
      max-width: 72ch;
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill-group {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border-radius: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      gap: 2px;
      flex-wrap: wrap;
    }

    .pill {
      height: 27px;
      padding: 0 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--ink-secondary);
      font-size: 12px;
      font-weight: 500;
      transition: all 140ms var(--ease);
      white-space: nowrap;
    }

    .pill:hover {
      color: var(--ink-primary);
      background: rgba(255, 255, 255, 0.04);
    }

    .pill.is-active {
      background: var(--bg-hover);
      color: var(--ink-primary);
      box-shadow: inset 0 0 0 1px var(--border-subtle);
    }

    /* Revealed Scorecard Panel */
    .scorecard {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: fadeSlideIn 220ms var(--ease);
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .scorecard-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .scorecard-title-group h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .scorecard-title-group p {
      margin: 3px 0 0;
      font-size: 12.5px;
      color: var(--ink-secondary);
    }

    .family-summary {
      display: flex;
      align-items: stretch;
      gap: 10px;
      flex-wrap: wrap;
    }

    .family-box {
      padding: 8px 13px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-hairline);
      background: var(--bg-elevated);
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 210px;
    }

    .family-box.palette-0 { border-color: var(--pal-0-border); background: linear-gradient(135deg, var(--pal-0-grad), rgba(19, 22, 28, 0.4)); }
    .family-box.palette-1 { border-color: var(--pal-1-border); background: linear-gradient(135deg, var(--pal-1-grad), rgba(19, 22, 28, 0.4)); }
    .family-box.palette-2 { border-color: var(--pal-2-border); background: linear-gradient(135deg, var(--pal-2-grad), rgba(19, 22, 28, 0.4)); }
    .family-box.palette-3 { border-color: var(--pal-3-border); background: linear-gradient(135deg, var(--pal-3-grad), rgba(19, 22, 28, 0.4)); }
    .family-box.palette-4 { border-color: var(--pal-4-border); background: linear-gradient(135deg, var(--pal-4-grad), rgba(19, 22, 28, 0.4)); }
    .family-box.palette-5 { border-color: var(--pal-5-border); background: linear-gradient(135deg, var(--pal-5-grad), rgba(19, 22, 28, 0.4)); }

    .family-box-pts {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .family-box.palette-0 .family-box-pts { color: var(--pal-0-ink); }
    .family-box.palette-1 .family-box-pts { color: var(--pal-1-ink); }
    .family-box.palette-2 .family-box-pts { color: var(--pal-2-ink); }
    .family-box.palette-3 .family-box-pts { color: var(--pal-3-ink); }
    .family-box.palette-4 .family-box-pts { color: var(--pal-4-ink); }
    .family-box.palette-5 .family-box-pts { color: var(--pal-5-ink); }

    .family-box-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .family-box-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-primary);
    }

    .family-box-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-secondary);
      font-variant-numeric: tabular-nums;
    }

    .scorecard-table-wrap {
      overflow-x: auto;
    }

    .scorecard-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    .scorecard-table th {
      text-align: left;
      padding: 7px 10px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-muted);
      border-bottom: 1px solid var(--border-hairline);
      white-space: nowrap;
    }

    .scorecard-table td {
      padding: 9px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      vertical-align: middle;
      white-space: nowrap;
    }

    .scorecard-table tr:last-child td {
      border-bottom: none;
    }

    .score-bar-cell {
      width: 150px;
    }

    .score-bar-track {
      height: 6px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 260ms var(--ease);
    }

    .score-bar-fill.palette-0 { background: var(--pal-0-ink); }
    .score-bar-fill.palette-1 { background: var(--pal-1-ink); }
    .score-bar-fill.palette-2 { background: var(--pal-2-ink); }
    .score-bar-fill.palette-3 { background: var(--pal-3-ink); }
    .score-bar-fill.palette-4 { background: var(--pal-4-ink); }
    .score-bar-fill.palette-5 { background: var(--pal-5-ink); }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .challenge-picks-inline {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .pick-tag {
      font-family: var(--font-mono);
      font-size: 10.5px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-hairline);
      color: var(--ink-muted);
      background: rgba(255, 255, 255, 0.02);
    }

    .pick-tag.r1 { color: var(--rank-1-ink); border-color: var(--rank-1-border); background: var(--rank-1-bg); }
    .pick-tag.r2 { color: var(--rank-2-ink); border-color: var(--rank-2-border); background: var(--rank-2-bg); }
    .pick-tag.r3 { color: var(--rank-3-ink); border-color: var(--rank-3-border); background: var(--rank-3-bg); }
    .pick-tag.def { color: var(--defect-ink); border-color: var(--defect-border); background: var(--defect-bg); }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .grid.cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    @media (max-width: 1159px) {
      .grid, .grid.cols-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 719px) {
      .grid, .grid.cols-2 {
        grid-template-columns: minmax(0, 1fr);
      }
      .topbar-inner, .shell {
        padding-left: 14px;
        padding-right: 14px;
      }
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease);
    }

    .card:hover {
      border-color: var(--border-subtle);
    }

    .card.is-compare-selected {
      border-color: var(--compare-border);
      box-shadow: 0 0 0 1px var(--compare-border);
    }

    .card.has-rank-1 {
      border-color: var(--rank-1-border);
    }

    .card-head {
      padding: 11px 13px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--border-hairline);
      background: rgba(255, 255, 255, 0.012);
    }

    .card-id-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .blind-label {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--ink-primary);
    }

    .card-head-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .icon-btn {
      height: 26px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid var(--border-hairline);
      background: transparent;
      color: var(--ink-secondary);
      font-size: 11.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 140ms var(--ease);
    }

    .icon-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-subtle);
      color: var(--ink-primary);
    }

    .icon-btn.is-active {
      background: var(--compare-bg);
      border-color: var(--compare-border);
      color: var(--compare-ink);
    }

    /* Revealed Meta Strip (rendered ONLY when revealed) */
    .reveal-strip {
      padding: 9px 13px;
      border-bottom: 1px solid var(--border-hairline);
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeSlideIn 180ms var(--ease);
    }

    .reveal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .family-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid transparent;
    }

    .family-chip.palette-0 { color: var(--pal-0-ink); background: var(--pal-0-bg); border-color: var(--pal-0-border); }
    .family-chip.palette-1 { color: var(--pal-1-ink); background: var(--pal-1-bg); border-color: var(--pal-1-border); }
    .family-chip.palette-2 { color: var(--pal-2-ink); background: var(--pal-2-bg); border-color: var(--pal-2-border); }
    .family-chip.palette-3 { color: var(--pal-3-ink); background: var(--pal-3-bg); border-color: var(--pal-3-border); }
    .family-chip.palette-4 { color: var(--pal-4-ink); background: var(--pal-4-bg); border-color: var(--pal-4-border); }
    .family-chip.palette-5 { color: var(--pal-5-ink); background: var(--pal-5-bg); border-color: var(--pal-5-border); }

    .family-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .reveal-stats {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-secondary);
      font-variant-numeric: tabular-nums;
    }

    .reveal-stat {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .reveal-stat strong {
      color: var(--ink-primary);
      font-weight: 600;
    }

    .reveal-stat.warn strong {
      color: var(--defect-ink);
    }

    /* Per-card view switcher */
    .card-views {
      padding: 7px 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border-hairline);
      background: rgba(8, 10, 13, 0.45);
    }
    .card-views::-webkit-scrollbar {
      display: none;
    }

    .mini-pill {
      height: 22px;
      padding: 0 7px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-muted);
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      transition: all 130ms var(--ease);
    }

    .mini-pill:hover {
      color: var(--ink-primary);
      background: rgba(255, 255, 255, 0.05);
    }

    .mini-pill.is-active {
      color: var(--ink-primary);
      background: var(--bg-hover);
      border-color: var(--border-subtle);
    }

    .mini-pill.is-override {
      color: var(--compare-ink);
      border-color: var(--compare-border);
      background: var(--compare-bg);
    }

    /* Screenshot Viewport Frame */
    .card-stage {
      position: relative;
      background: var(--bg-inset);
      height: 460px;
      overflow-y: auto;
      overflow-x: hidden;
      cursor: zoom-in;
      border-bottom: 1px solid var(--border-hairline);
    }

    .card-stage.mode-fit {
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .card-stage img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
      background: #0f1218;
      transition: opacity 160ms var(--ease);
    }

    .card-stage.is-narrow-view img {
      max-width: 375px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .card-stage.mode-fit img {
      width: 100%;
      height: 100%;
      max-width: 100%;
      object-fit: contain;
      box-shadow: none;
      background: transparent;
    }

    .stage-expand-hint {
      position: sticky;
      bottom: 8px;
      float: right;
      margin-right: 8px;
      margin-top: -32px;
      padding: 3px 8px;
      border-radius: 5px;
      background: rgba(12, 14, 18, 0.82);
      border: 1px solid var(--border-subtle);
      color: var(--ink-secondary);
      font-family: var(--font-mono);
      font-size: 10.5px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 150ms var(--ease);
    }

    .card-stage:hover .stage-expand-hint {
      opacity: 1;
    }

    .card-stage.mode-fit .stage-expand-hint {
      position: absolute;
      float: none;
      margin: 0;
      right: 10px;
      bottom: 10px;
    }

    /* Card Footer: Blind Voting Bar */
    .card-foot {
      padding: 9px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--bg-surface);
    }

    .rank-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .rank-btn {
      height: 27px;
      padding: 0 9px;
      border-radius: 6px;
      border: 1px solid var(--border-hairline);
      background: var(--bg-elevated);
      color: var(--ink-secondary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      transition: all 140ms var(--ease);
    }

    .rank-btn:hover {
      border-color: var(--border-strong);
      color: var(--ink-primary);
    }

    .rank-btn.r1.is-active {
      color: var(--rank-1-ink);
      background: var(--rank-1-bg);
      border-color: var(--rank-1-border);
    }

    .rank-btn.r2.is-active {
      color: var(--rank-2-ink);
      background: var(--rank-2-bg);
      border-color: var(--rank-2-border);
    }

    .rank-btn.r3.is-active {
      color: var(--rank-3-ink);
      background: var(--rank-3-bg);
      border-color: var(--rank-3-border);
    }

    .defect-btn {
      height: 27px;
      padding: 0 9px;
      border-radius: 6px;
      border: 1px solid var(--border-hairline);
      background: transparent;
      color: var(--ink-muted);
      font-size: 11.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 140ms var(--ease);
    }

    .defect-btn:hover {
      border-color: var(--defect-border);
      color: var(--defect-ink);
    }

    .defect-btn.is-active {
      color: var(--defect-ink);
      background: var(--defect-bg);
      border-color: var(--defect-border);
    }

    /* Modals (Lightbox & 2-Up Compare) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(6, 7, 10, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      padding: 16px;
      animation: fadeIn 150ms var(--ease);
    }

    .modal-backdrop[hidden] {
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-panel {
      width: 100%;
      height: 100%;
      max-width: 1680px;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65);
    }

    .modal-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--bg-elevated);
      flex-shrink: 0;
    }

    .modal-title-block {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .modal-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Lightbox Canvas */
    .lightbox-body {
      position: relative;
      flex: 1;
      min-height: 0;
      background: var(--bg-inset);
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 64px;
    }

    .lightbox-body.is-native {
      align-items: flex-start;
      justify-content: safe center;
      padding: 20px;
    }

    .lightbox-img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 12px 44px rgba(0, 0, 0, 0.55);
      cursor: zoom-in;
    }

    .lightbox-body.is-native .lightbox-img {
      max-width: none;
      max-height: none;
      width: auto;
      height: auto;
      cursor: zoom-out;
    }

    .lb-nav-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 58px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: rgba(19, 22, 28, 0.86);
      color: var(--ink-primary);
      display: grid;
      place-items: center;
      z-index: 105;
      transition: all 140ms var(--ease);
    }

    .lb-nav-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }

    .lb-nav-prev { left: 26px; }
    .lb-nav-next { right: 26px; }

    .lightbox-footer {
      padding: 8px 16px;
      border-top: 1px solid var(--border-hairline);
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--ink-muted);
      flex-shrink: 0;
    }

    .kbd {
      font-family: var(--font-mono);
      font-size: 10.5px;
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--ink-secondary);
    }

    /* 2-Up Compare Modal */
    .compare-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-inset);
    }

    @media (max-width: 719px) {
      .compare-grid {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }

    .compare-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid var(--border-subtle);
    }

    .compare-pane:last-child {
      border-right: none;
    }

    .compare-pane-bar {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border-hairline);
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .compare-select {
      height: 28px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--ink-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
    }

    .compare-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 14px;
      background: var(--bg-inset);
    }

    .compare-scroll img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
      border-radius: 3px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
    }

    .compare-scroll.is-narrow img {
      max-width: 375px;
    }

    .compare-scroll.is-fit {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .compare-scroll.is-fit img {
      width: 100%;
      height: 100%;
      max-width: 100%;
      object-fit: contain;
      box-shadow: none;
    }

    .sync-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--ink-secondary);
      font-size: 12px;
      font-weight: 500;
      user-select: none;
      cursor: pointer;
    }

    .sync-toggle input {
      accent-color: var(--ink-primary);
      margin: 0;
    }

    .sync-toggle.is-on {
      color: var(--ink-primary);
      border-color: var(--border-strong);
      background: var(--bg-hover);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="2" y="2.5" width="5" height="11" rx="1.2" fill="#e2e8f0" opacity="0.85"/>
            <rect x="9" y="2.5" width="5" height="11" rx="1.2" fill="#94a3b8" opacity="0.55"/>
          </svg>
        </div>
        <div class="brand-text">
          <span id="brandTitle" class="brand-title">Designer Bench</span>
          <span id="blindStatusBadge" class="brand-status">Blind Mode</span>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="compareLaunchBtn" class="btn" type="button" disabled title="Pick 2 models on cards to compare side-by-side">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="1.5" y="2.5" width="5.5" height="11" rx="1.2" stroke="currentColor" stroke-width="1.4"/>
            <rect x="9" y="2.5" width="5.5" height="11" rx="1.2" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          <span id="compareLaunchLabel">Compare 2-Up (0/2)</span>
        </button>

        <button id="clearVotesBtn" class="btn btn-ghost" type="button" title="Clear all saved blind votes">
          Clear votes
        </button>

        <button id="revealToggleBtn" class="btn btn-reveal" type="button" aria-pressed="false">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M1.5 8C2.9 5.2 5.3 3.7 8 3.7C10.7 3.7 13.1 5.2 14.5 8C13.1 10.8 10.7 12.3 8 12.3C5.3 12.3 2.9 10.8 1.5 8Z" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          <span id="revealToggleLabel">Reveal Models</span>
        </button>
      </div>
    </div>
  </header>

  <main class="shell">
    <nav id="challengeBar" class="challenge-bar" aria-label="Benchmark challenges"></nav>

    <section class="control-strip" aria-label="Active challenge controls">
      <div class="challenge-meta">
        <h1 id="challengeTitle" class="challenge-title"></h1>
        <p id="challengeSubtitle" class="challenge-subtitle"></p>
      </div>

      <div class="controls-right">
        <div id="globalViewBar" class="pill-group" role="group" aria-label="Synchronized viewport switcher"></div>

        <div class="pill-group" role="group" aria-label="Card framing mode">
          <button id="frameScrollBtn" class="pill is-active" type="button" aria-pressed="true">Scrollable Viewport</button>
          <button id="frameFitBtn" class="pill" type="button" aria-pressed="false">Fit Full Page</button>
        </div>
      </div>
    </section>

    <section id="scorecardContainer" aria-label="Blind vote scorecard" hidden></section>

    <section id="cardsGrid" class="grid" aria-label="Model screenshots"></section>
  </main>

  <!-- Full-Res Lightbox Modal -->
  <div id="lightboxModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Full resolution screenshot viewer" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <div class="modal-title-block">
          <span id="lbBlindLabel" class="blind-label"></span>
          <span id="lbRevealSlot"></span>
          <div id="lbRankSlot" class="rank-group"></div>
        </div>
        <div class="modal-controls">
          <div id="lbViewBar" class="pill-group" role="group" aria-label="Lightbox view switcher"></div>
          <div class="pill-group" role="group" aria-label="Lightbox zoom mode">
            <button id="lbZoomFitBtn" class="pill is-active" type="button">Fit</button>
            <button id="lbZoomNativeBtn" class="pill" type="button">100% Native</button>
          </div>
          <button id="lbCloseBtn" class="btn" type="button" aria-label="Close lightbox">Close</button>
        </div>
      </div>

      <div id="lbBody" class="lightbox-body">
        <button id="lbPrevBtn" class="lb-nav-btn lb-nav-prev" type="button" aria-label="Previous model">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M10 3.5L5.5 8L10 12.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <img id="lbImg" class="lightbox-img" alt="" />
        <button id="lbNextBtn" class="lb-nav-btn lb-nav-next" type="button" aria-label="Next model">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="lightbox-footer">
        <span id="lbMetaLine" class="mono"></span>
        <span>
          <span class="kbd">←</span> <span class="kbd">→</span> flip models &nbsp;·&nbsp;
          <span class="kbd">Z</span> zoom &nbsp;·&nbsp;
          <span class="kbd">Esc</span> close
        </span>
      </div>
    </div>
  </div>

  <!-- 2-Up Side-by-Side Compare Modal -->
  <div id="compareModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Two-up side by side comparison" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <div class="modal-title-block">
          <span class="blind-label">2-Up Side-by-Side Compare</span>
          <span id="cmpChallengeTag" class="brand-status"></span>
        </div>
        <div class="modal-controls">
          <div id="cmpViewBar" class="pill-group" role="group" aria-label="Compare view switcher"></div>
          <div class="pill-group" role="group" aria-label="Compare fit mode">
            <button id="cmpScrollModeBtn" class="pill is-active" type="button">Scroll</button>
            <button id="cmpFitModeBtn" class="pill" type="button">Fit</button>
          </div>
          <label id="cmpSyncLabel" class="sync-toggle is-on">
            <input id="cmpSyncCheckbox" type="checkbox" checked />
            Sync Scroll
          </label>
          <button id="cmpCloseBtn" class="btn" type="button" aria-label="Close comparison">Close</button>
        </div>
      </div>

      <div class="compare-grid">
        <div class="compare-pane">
          <div class="compare-pane-bar">
            <select id="cmpLeftSelect" class="compare-select" aria-label="Left comparison model"></select>
            <div id="cmpLeftReveal"></div>
          </div>
          <div id="cmpLeftScroll" class="compare-scroll">
            <img id="cmpLeftImg" alt="" />
          </div>
        </div>

        <div class="compare-pane">
          <div class="compare-pane-bar">
            <select id="cmpRightSelect" class="compare-select" aria-label="Right comparison model"></select>
            <div id="cmpRightReveal"></div>
          </div>
          <div id="cmpRightScroll" class="compare-scroll">
            <img id="cmpRightImg" alt="" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GALLERY_DATA = __GALLERY_DATA_JSON__;

    const STORAGE_KEY = "subagent_bench_votes_" + String(GALLERY_DATA?.benchmarkId || "v1").replace(/[^a-zA-Z0-9_-]/g, "_");

    // Deterministic family -> palette-0..palette-5 mapping
    const FAMILY_PALETTE_MAP = (() => {
      const unique = new Set();
      for (const ch of (GALLERY_DATA?.challenges || [])) {
        for (const entry of (ch.entries || [])) {
          const fam = String(entry.family || entry.modelName || entry.configId || "Unknown");
          unique.add(fam);
        }
      }
      const sorted = Array.from(unique).sort((a, b) => a.localeCompare(b));
      const map = new Map();
      sorted.forEach((fam, idx) => {
        map.set(fam, `palette-${idx % 6}`);
      });
      return map;
    })();

    function getFamilyPaletteClass(family) {
      const key = String(family || "Unknown");
      return FAMILY_PALETTE_MAP.get(key) || "palette-0";
    }

    const state = {
      activeChallengeId: GALLERY_DATA?.challenges?.[0]?.id || "",
      globalViews: {},
      cardViewOverrides: {},
      frameMode: "scroll", // "scroll" | "fit"
      revealed: false,
      compareSelection: {}, // { [challengeId]: [blindLabel, ...] }
      votes: loadVotes(),
      lightbox: {
        open: false,
        entryIndex: 0,
        viewId: null,
        zoom: "fit" // "fit" | "native"
      },
      compareModal: {
        open: false,
        leftLabel: null,
        rightLabel: null,
        viewId: null,
        syncScroll: true,
        fitMode: false
      }
    };

    // Initialize default global views per challenge
    for (const ch of (GALLERY_DATA?.challenges || [])) {
      state.globalViews[ch.id] = ch.views?.[0]?.id || "";
      state.cardViewOverrides[ch.id] = {};
      state.compareSelection[ch.id] = [];
    }

    function loadVotes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch {
        return {};
      }
    }

    function saveVotes() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.votes));
      } catch {
        // Ignore storage errors in restricted environments
      }
    }

    function getChallenge(id = state.activeChallengeId) {
      const challenges = GALLERY_DATA?.challenges || [];
      return challenges.find(c => c.id === id) || challenges[0];
    }

    function getChallengeVotes(chId) {
      if (!state.votes[chId]) {
        state.votes[chId] = { ranks: {}, defects: {} };
      }
      if (!state.votes[chId].ranks) state.votes[chId].ranks = {};
      if (!state.votes[chId].defects) state.votes[chId].defects = {};
      return state.votes[chId];
    }

    function getEntryRank(chId, blindLabel) {
      const cv = getChallengeVotes(chId);
      for (const r of ["1", "2", "3"]) {
        if (cv.ranks[r] === blindLabel) return r;
      }
      return null;
    }

    function setEntryRank(chId, blindLabel, rank) {
      const cv = getChallengeVotes(chId);
      const currentRank = getEntryRank(chId, blindLabel);
      if (currentRank) {
        delete cv.ranks[currentRank];
      }
      if (currentRank !== rank) {
        cv.ranks[rank] = blindLabel;
      }
      saveVotes();
      renderAll();
    }

    function toggleDefect(chId, blindLabel) {
      const cv = getChallengeVotes(chId);
      if (cv.defects[blindLabel]) {
        delete cv.defects[blindLabel];
      } else {
        cv.defects[blindLabel] = true;
      }
      saveVotes();
      renderAll();
    }

    function clearAllVotes() {
      state.votes = {};
      saveVotes();
      renderAll();

    function isNarrowView(viewObj) {
      if (!viewObj) return false;
      const hay = (viewObj.id + " " + viewObj.label + " " + (viewObj.file || "")).toLowerCase();
      return hay.includes("375") || hay.includes("mobile") || hay.includes("nav");
    }

    function resolveImgUrl(url) {
      if (!url) return "";
      if (url.startsWith("data:") || url.startsWith("http://") || url.startsWith("https://")) {
        return url;
      }
      if (window.location.protocol !== "file:" && url.startsWith("file:///tmp/opencode/playwright-mcp/")) {
        return "/__imgs__/" + url.slice("file:///tmp/opencode/playwright-mcp/".length);
      }
      return url;
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatWall(seconds) {
      const sVal = Number(seconds || 0);
      if (sVal >= 60) {
        const m = Math.floor(sVal / 60);
        const s = Math.round(sVal % 60);
        return `${m}m ${String(s).padStart(2, "0")}s`;
      }
      return `${sVal.toFixed(1)}s`;
    }

    function formatCost(cost) {
      return `$${Number(cost || 0).toFixed(2)}`;
    }

    function computeScorecardData() {
      const configMap = new Map();

      for (const ch of (GALLERY_DATA?.challenges || [])) {
        for (const entry of (ch.entries || [])) {
          const cid = entry.configId || entry.modelName || entry.blindLabel;
          const fam = entry.family || entry.modelName || cid;
          if (!configMap.has(cid)) {
            configMap.set(cid, {
              configId: cid,
              modelName: entry.modelName || cid,
              family: fam,
              tier: entry.tier || "",
              points: 0,
              r1: 0,
              r2: 0,
              r3: 0,
              defects: 0,
              totalCost: 0,
              totalWall: 0,
              runs: 0,
              picks: []
            });
          }
          const rec = configMap.get(cid);
          rec.totalCost += Number(entry.cost || 0);
          rec.totalWall += Number(entry.wallS || 0);
          rec.runs += 1;
        }
      }

      const rankPts = { "1": 3, "2": 2, "3": 1 };
      let totalVotesCast = 0;

      for (const ch of (GALLERY_DATA?.challenges || [])) {
        const cv = getChallengeVotes(ch.id);
        const shortTag = String(ch.short || ch.id).split("·")[0].trim();

        for (const entry of (ch.entries || [])) {
          const cid = entry.configId || entry.modelName || entry.blindLabel;
          const rec = configMap.get(cid);
          if (!rec) continue;
          const rank = getEntryRank(ch.id, entry.blindLabel);
          const isDef = Boolean(cv.defects[entry.blindLabel]);
          if (rank) {
            rec.points += rankPts[rank];
            rec["r" + rank] += 1;
            totalVotesCast += 1;
            rec.picks.push({ label: `${shortTag}: ${rank === "1" ? "1st" : rank === "2" ? "2nd" : "3rd"}`, cls: "r" + rank });
          }
          if (isDef) {
            rec.defects += 1;
            totalVotesCast += 1;
            rec.picks.push({ label: `${shortTag}: Defect`, cls: "def" });
          }
        }
      }

      const rows = Array.from(configMap.values()).sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        if (b.r1 !== a.r1) return b.r1 - a.r1;
        if (a.defects !== b.defects) return a.defects - b.defects;
        return a.modelName.localeCompare(b.modelName);
      });

      const families = new Map();
      for (const r of rows) {
        if (!families.has(r.family)) {
          families.set(r.family, { name: r.family, points: 0, r1: 0, defects: 0, cost: 0, wall: 0, runs: 0 });
        }
        const f = families.get(r.family);
        f.points += r.points;
        f.r1 += r.r1;
        f.defects += r.defects;
        f.cost += r.totalCost;
        f.wall += r.totalWall;
        f.runs += r.runs;
      }

      const familyList = Array.from(families.values()).sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        if (b.r1 !== a.r1) return b.r1 - a.r1;
        return a.name.localeCompare(b.name);
      });

      return { rows, familyList, totalVotesCast };
    }

                      <td class="mono">${formatCost(r.totalCost)}</td>
                      <td class="mono">${formatWall(r.totalWall / Math.max(1, r.runs))}</td>
                      <td>
                        <div class="challenge-picks-inline">
                          ${r.picks.length
                            ? r.picks.map(p => `<span class="pick-tag ${p.cls}">${escapeHtml(p.label)}</span>`).join("")
                            : `<span style="color:var(--ink-muted)">—</span>`
                          }

                  `;
                }).join("")}

      `;
    }

    /* Lightbox Rendering & Controls */
    function openLightbox(entryIndex) {
      const ch = getChallenge();
      const entry = ch?.entries?.[entryIndex];
      if (!entry) return;
      const overrides = state.cardViewOverrides[ch.id] || {};
      const activeViewId = overrides[entry.blindLabel] || state.globalViews[ch.id] || ch.views?.[0]?.id;

      state.lightbox.open = true;
      state.lightbox.entryIndex = entryIndex;
      state.lightbox.viewId = activeViewId;
      state.lightbox.zoom = "fit";

      elLbModal.hidden = false;

      renderLightbox();

    function closeLightbox() {
      if (!state.lightbox.open) return;
      state.lightbox.open = false;
      elLbModal.hidden = true;
      if (!state.compareModal.open) {
        document.body.style.overflow = "";

    function renderLightbox() {
      if (!state.lightbox.open) return;
      const ch = getChallenge();
      const entry = ch?.entries?.[state.lightbox.entryIndex];
      if (!entry) return;
      const viewObj = (ch.views || []).find(v => v.id === state.lightbox.viewId) || ch.views?.[0];
      const rank = getEntryRank(ch.id, entry.blindLabel);
      const isDefect = Boolean(getChallengeVotes(ch.id).defects[entry.blindLabel]);

      elLbBlindLabel.textContent = entry.blindLabel;
      elLbRevealSlot.innerHTML = state.revealed ? buildRevealBadgeHtml(entry, true) : "";

      elLbRankSlot.innerHTML = `
        <button class="rank-btn r1${rank === "1" ? " is-active" : ""}" type="button" data-lb-rank="1">1st</button>

      elLbViewBar.innerHTML = (ch.views || []).map(v => `
        <button class="pill${v.id === viewObj?.id ? " is-active" : ""}" type="button" data-lb-view="${escapeHtml(v.id)}">${escapeHtml(v.label)}</button>

      const isNative = state.lightbox.zoom === "native";

        ? `${entry.blindLabel} (${entry.modelName || entry.configId}) — ${viewObj?.label || ""}`
        : `${entry.blindLabel} — ${viewObj?.label || ""}`;

      elLbMetaLine.textContent = `${ch.short} · ${entry.blindLabel} (${state.lightbox.entryIndex + 1}/${ch.entries.length}) · ${viewObj?.label || ""}`;
    }

    function stepLightbox(delta) {
      const ch = getChallenge();
      const len = ch?.entries?.length || 0;
      if (!len) return;
      state.lightbox.entryIndex = (state.lightbox.entryIndex + delta + len) % len;
      elLbBody.scrollTop = 0;
      renderLightbox();
    }

    /* 2-Up Compare Rendering & Synced Scroll */
    function openCompareModal() {
      const ch = getChallenge();
      if (!ch || !ch.entries || ch.entries.length < 2) return;
      const sel = state.compareSelection[ch.id] || [];
      const leftLabel = sel[0] || ch.entries[0].blindLabel;
      const rightLabel = sel[1] || ch.entries[1].blindLabel;

      state.compareModal.open = true;
      state.compareModal.leftLabel = leftLabel;
      state.compareModal.rightLabel = rightLabel;
      state.compareModal.viewId = state.globalViews[ch.id] || ch.views?.[0]?.id;

      elCmpModal.hidden = false;
      document.body.style.overflow = "hidden";
      renderCompareModal();
      elCmpCloseBtn.focus();
    }

    function closeCompareModal() {
      if (!state.compareModal.open) return;
      state.compareModal.open = false;
      elCmpModal.hidden = true;
      if (!state.lightbox.open) {
        document.body.style.overflow = "";
      }
    }

    function renderCompareModal() {
      if (!state.compareModal.open) return;
      const ch = getChallenge();
      if (!ch || !ch.entries || ch.entries.length < 2) return;
      const viewObj = (ch.views || []).find(v => v.id === state.compareModal.viewId) || ch.views?.[0];
      const leftEntry = ch.entries.find(e => e.blindLabel === state.compareModal.leftLabel) || ch.entries[0];
      const rightEntry = ch.entries.find(e => e.blindLabel === state.compareModal.rightLabel) || ch.entries[1];

      elCmpChallengeTag.textContent = ch.short;

      elCmpViewBar.innerHTML = (ch.views || []).map(v => `
        <button class="pill${v.id === viewObj?.id ? " is-active" : ""}" type="button" data-cmp-view="${escapeHtml(v.id)}">${escapeHtml(v.label)}</button>
      `).join("");

      const optionsHtml = (selected) => ch.entries.map(e => `
        <option value="${escapeHtml(e.blindLabel)}"${e.blindLabel === selected ? " selected" : ""}>${escapeHtml(e.blindLabel)}</option>
      `).join("");

      elCmpLeftSelect.innerHTML = optionsHtml(leftEntry.blindLabel);
      elCmpRightSelect.innerHTML = optionsHtml(rightEntry.blindLabel);

      elCmpLeftReveal.innerHTML = state.revealed ? buildRevealBadgeHtml(leftEntry, true) : "";
      elCmpRightReveal.innerHTML = state.revealed ? buildRevealBadgeHtml(rightEntry, true) : "";

      const narrow = isNarrowView(viewObj);
      elCmpLeftScroll.classList.toggle("is-narrow", narrow);
      elCmpRightScroll.classList.toggle("is-narrow", narrow);
      elCmpLeftScroll.classList.toggle("is-fit", state.compareModal.fitMode);
      elCmpRightScroll.classList.toggle("is-fit", state.compareModal.fitMode);

      elCmpScrollModeBtn.classList.toggle("is-active", !state.compareModal.fitMode);
      elCmpFitModeBtn.classList.toggle("is-active", state.compareModal.fitMode);

      elCmpSyncCheckbox.checked = state.compareModal.syncScroll;
      elCmpSyncLabel.classList.toggle("is-on", state.compareModal.syncScroll);

      const viewLabel = viewObj?.label || "";
      elCmpLeftImg.src = viewObj ? resolveImgUrl(leftEntry.images?.[viewObj.id]) : "";
      elCmpLeftImg.alt = state.revealed ? `${leftEntry.blindLabel} (${leftEntry.modelName || leftEntry.configId}) — ${viewLabel}` : `${leftEntry.blindLabel} — ${viewLabel}`;

      elCmpRightImg.src = viewObj ? resolveImgUrl(rightEntry.images?.[viewObj.id]) : "";
      elCmpRightImg.alt = state.revealed ? `${rightEntry.blindLabel} (${rightEntry.modelName || rightEntry.configId}) — ${viewLabel}` : `${rightEntry.blindLabel} — ${viewLabel}`;
    }

    let scrollSyncLock = false;
    function syncScrollPanes(source, target) {
      if (!state.compareModal.syncScroll || state.compareModal.fitMode || scrollSyncLock) return;
      scrollSyncLock = true;
      const srcMax = Math.max(1, source.scrollHeight - source.clientHeight);
      const tgtMax = Math.max(0, target.scrollHeight - target.clientHeight);
      const ratio = source.scrollTop / srcMax;
      target.scrollTop = Math.round(ratio * tgtMax);
      requestAnimationFrame(() => {
        scrollSyncLock = false;
      });
    }

    elCmpLeftScroll.addEventListener("scroll", () => syncScrollPanes(elCmpLeftScroll, elCmpRightScroll), { passive: true });
    elCmpRightScroll.addEventListener("scroll", () => syncScrollPanes(elCmpRightScroll, elCmpLeftScroll), { passive: true });

    function renderAll() {
      renderTopControls();
      renderChallengeTabs();
      renderControlStrip();
      renderScorecard();
      renderCards();
      if (state.lightbox.open) renderLightbox();
      if (state.compareModal.open) renderCompareModal();
    }

    /* Event Delegation & Listeners */
    elChallengeBar.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-challenge]");
      if (!btn) return;
      state.activeChallengeId = btn.dataset.challenge;
      renderAll();
    });

    elGlobalViewBar.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-global-view]");
      if (!btn) return;
      const chId = state.activeChallengeId;
      state.globalViews[chId] = btn.dataset.globalView;
      state.cardViewOverrides[chId] = {};
      renderAll();
    });

    elFrameScrollBtn.addEventListener("click", () => {
      state.frameMode = "scroll";
      renderAll();
    });

    elFrameFitBtn.addEventListener("click", () => {
      state.frameMode = "fit";
      renderAll();
    });

    elRevealBtn.addEventListener("click", () => {
      state.revealed = !state.revealed;
      renderAll();
    });

    elClearVotesBtn.addEventListener("click", () => {
      clearAllVotes();
    });

    elCompareLaunchBtn.addEventListener("click", () => {
      const sel = state.compareSelection[state.activeChallengeId] || [];
      if (sel.length === 2) {
        openCompareModal();
      }
    });

    elCardsGrid.addEventListener("click", (e) => {
      const actionEl = e.target.closest("[data-action]");
      if (!actionEl) return;
      const action = actionEl.dataset.action;
      const chId = state.activeChallengeId;

      if (action === "open-lightbox") {
        openLightbox(Number(actionEl.dataset.index));
        return;
      }

      if (action === "card-view") {
        const label = actionEl.dataset.label;
        const viewId = actionEl.dataset.view;
        if (!state.cardViewOverrides[chId]) state.cardViewOverrides[chId] = {};
        if (viewId === state.globalViews[chId]) {
          delete state.cardViewOverrides[chId][label];
        } else {
          state.cardViewOverrides[chId][label] = viewId;
        }
        renderCards();
        return;
      }

      if (action === "compare-toggle") {
        const label = actionEl.dataset.label;
        const sel = state.compareSelection[chId] || [];
        const existingIdx = sel.indexOf(label);
        if (existingIdx !== -1) {
          sel.splice(existingIdx, 1);
        } else if (sel.length < 2) {
          sel.push(label);
        } else {
          sel[1] = label;
        }
        state.compareSelection[chId] = sel;
        renderTopControls();
        renderCards();
        return;
      }

      if (action === "rank") {
        setEntryRank(chId, actionEl.dataset.label, actionEl.dataset.rank);
        return;
      }

      if (action === "defect") {
        toggleDefect(chId, actionEl.dataset.label);
      }
    });

    /* Lightbox Events */
    elLbCloseBtn.addEventListener("click", closeLightbox);
    elLbModal.addEventListener("click", (e) => {
      if (e.target === elLbModal) closeLightbox();
    });
    elLbPrevBtn.addEventListener("click", () => stepLightbox(-1));
    elLbNextBtn.addEventListener("click", () => stepLightbox(1));

    elLbZoomFitBtn.addEventListener("click", () => {
      state.lightbox.zoom = "fit";
      renderLightbox();
    });
    elLbZoomNativeBtn.addEventListener("click", () => {
      state.lightbox.zoom = "native";
      renderLightbox();
    });
    elLbImg.addEventListener("click", () => {
      state.lightbox.zoom = state.lightbox.zoom === "fit" ? "native" : "fit";
      renderLightbox();
    });

    elLbViewBar.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-lb-view]");
      if (!btn) return;
      state.lightbox.viewId = btn.dataset.lbView;
      elLbBody.scrollTop = 0;
      renderLightbox();
    });

    elLbRankSlot.addEventListener("click", (e) => {
      const ch = getChallenge();
      const entry = ch?.entries?.[state.lightbox.entryIndex];
      if (!entry) return;
      const rankBtn = e.target.closest("[data-lb-rank]");
      if (rankBtn) {
        setEntryRank(ch.id, entry.blindLabel, rankBtn.dataset.lbRank);
        return;
      }
      const defBtn = e.target.closest("[data-lb-defect]");
      if (defBtn) {
        toggleDefect(ch.id, entry.blindLabel);
      }
    });

    /* Compare Modal Events */
    elCmpCloseBtn.addEventListener("click", closeCompareModal);
    elCmpModal.addEventListener("click", (e) => {
      if (e.target === elCmpModal) closeCompareModal();
    });
    elCmpViewBar.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-cmp-view]");
      if (!btn) return;
      state.compareModal.viewId = btn.dataset.cmpView;
      elCmpLeftScroll.scrollTop = 0;
      elCmpRightScroll.scrollTop = 0;
      renderCompareModal();
    });
    elCmpLeftSelect.addEventListener("change", () => {
      state.compareModal.leftLabel = elCmpLeftSelect.value;
      renderCompareModal();
    });
    elCmpRightSelect.addEventListener("change", () => {
      state.compareModal.rightLabel = elCmpRightSelect.value;
      renderCompareModal();
    });
    elCmpSyncCheckbox.addEventListener("change", () => {
      state.compareModal.syncScroll = elCmpSyncCheckbox.checked;
      elCmpSyncLabel.classList.toggle("is-on", state.compareModal.syncScroll);
    });
    elCmpScrollModeBtn.addEventListener("click", () => {
      state.compareModal.fitMode = false;
      renderCompareModal();
    });
    elCmpFitModeBtn.addEventListener("click", () => {
      state.compareModal.fitMode = true;
      renderCompareModal();
    });

    /* Global Keyboard Shortcuts */
    document.addEventListener("keydown", (e) => {
      if (state.lightbox.open) {
        if (e.key === "Escape") {
          e.preventDefault();
          closeLightbox();
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          stepLightbox(1);
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          stepLightbox(-1);
        } else if (e.key === "z" || e.key === "Z") {
          e.preventDefault();
          state.lightbox.zoom = state.lightbox.zoom === "fit" ? "native" : "fit";
          renderLightbox();
        }
        return;
      }

      if (state.compareModal.open && e.key === "Escape") {
        e.preventDefault();
        closeCompareModal();
      }
    });

    // Initial render
    renderAll();
  </script>
</body>
</html>
